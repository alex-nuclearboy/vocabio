name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.4.1"

  DJANGO_SECRET_KEY: "ci-only-secret-key-h6-unp6$s)%%2ck5ug*8e9+c^)m+n=1hd$z4=s16soupcoa2&+"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
  DJANGO_CSRF_TRUSTED_ORIGINS: ""
  DJANGO_SECURE_SSL_REDIRECT: "True"
  DJANGO_SESSION_COOKIE_SECURE: "True"
  DJANGO_CSRF_COOKIE_SECURE: "True"
  DJANGO_SECURE_HSTS_SECONDS: "0"
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
  DJANGO_SECURE_HSTS_PRELOAD: "False"

  DATABASE_URL: "postgresql://vocabio:vocabio@127.0.0.1:5432/vocabio"
  DATABASE_CONN_MAX_AGE: "0"
  DATABASE_CONN_HEALTH_CHECKS: "False"
  DATABASE_CONNECT_TIMEOUT: "5"

  DJANGO_LANGUAGE_CODE: "en-gb"
  DJANGO_TIME_ZONE: "UTC"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine

        env:
          POSTGRES_DB: vocabio
          POSTGRES_USER: vocabio
          POSTGRES_PASSWORD: vocabio

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U vocabio -d vocabio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Validate Poetry configuration
        run: poetry check

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root --no-ansi

      - name: Audit Python dependencies
        run: poetry run python -m pip_audit --local

      - name: Run Pylint
        run: >
          poetry run pylint
          --django-settings-module=config.settings
          --output-format=github
          config
          core
          infrastructure
          accounts
          tests
          manage.py
          docs/source/conf.py

      - name: Run Django checks
        run: poetry run python manage.py check

      - name: Check for missing migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: poetry run python manage.py collectstatic --noinput

      - name: Run tests with coverage
        run: poetry run pytest

      - name: Build documentation
        run: poetry run sphinx-build -E -a -W -n -T -b html docs/source docs/_build/html

  python-compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    services:
      postgres:
        image: postgres:18-alpine

        env:
          POSTGRES_DB: vocabio
          POSTGRES_USER: vocabio
          POSTGRES_PASSWORD: vocabio

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U vocabio -d vocabio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root --no-ansi

      - name: Run Django checks
        run: poetry run python manage.py check

      - name: Collect static files
        run: poetry run python manage.py collectstatic --noinput

      - name: Run tests with coverage
        run: poetry run pytest

  container-build:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build production image
        run: docker build --tag vocabio:ci .

      - name: Verify production image
        run: |
          docker run --rm --entrypoint python vocabio:ci --version
          docker run --rm --entrypoint gunicorn vocabio:ci --version
          test "$(docker run --rm --entrypoint id vocabio:ci -u)" = "10001"
          docker run --rm --entrypoint sh vocabio:ci -c 'test -d /app/staticfiles'
          docker run --rm --entrypoint sh vocabio:ci -c '! test -d /app/logs'
          docker run --rm --entrypoint sh vocabio:ci -c '! command -v poetry'
